name: foodwise-ai

x-python-service: &python-service
  image: foodwise-ai-backend:0.1.0
  build:
    context: .
    dockerfile: infra/backend.Dockerfile
  init: true
  restart: unless-stopped
  networks: [services]

services:
  db:
    # Immutable cached upstream image: PostgreSQL 16.14 with pgvector.
    image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    environment:
      POSTGRES_DB: foodwise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
      FOODWISE_DB_PASSWORD: ${FOODWISE_DB_PASSWORD:?Set a URL-safe FOODWISE_DB_PASSWORD in your local .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-bootstrap.sh:/docker-entrypoint-initdb.d/01-bootstrap.sh:ro
    networks: [services]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d foodwise && psql -U postgres -d foodwise -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  mcp:
    <<: *python-service
    command: ["uvicorn", "food_recommender.mcp.server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8001", "--no-access-log"]
    environment:
      DATABASE_URL: postgresql+psycopg://foodwise:${FOODWISE_DB_PASSWORD:?Set FOODWISE_DB_PASSWORD}@db:5432/foodwise
      MEDIA_ROOT: /var/lib/foodwise/media
    volumes:
      - media_data:/var/lib/foodwise/media:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  backend:
    <<: *python-service
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?Set a fresh GROQ_API_KEY in your local .env}
      GROQ_MODEL: ${GROQ_MODEL-qwen/qwen3.8-27b}
      GROQ_VISION_MODEL: ${GROQ_VISION_MODEL-qwen/qwen3.8-27b}
      TAVILY_API_KEY: ${TAVILY_API_KEY-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Set a quoted Argon2id ADMIN_PASSWORD_HASH in your local .env}
      DATABASE_URL: postgresql+psycopg://foodwise:${FOODWISE_DB_PASSWORD:?Set FOODWISE_DB_PASSWORD}@db:5432/foodwise
      MCP_SERVER_URL: http://mcp:8001/mcp
      MEDIA_ROOT: /var/lib/foodwise/media
    volumes:
      - media_data:/var/lib/foodwise/media
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      mcp: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=8)"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s

  frontend:
    image: foodwise-ai-frontend:0.1.0
    build:
      context: .
      dockerfile: infra/frontend.Dockerfile
    init: true
    restart: unless-stopped
    networks: [services]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  services:

volumes:
  postgres_data:
  media_data:
