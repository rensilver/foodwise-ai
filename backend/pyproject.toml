[project]
name = "foodwise-ai-backend"
version = "0.1.0"
description = "Local restaurant and recipe recommendation backend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "anyio==4.15.1",
    "argon2-cffi==25.1.0",
    "fastapi==0.142.2",
    "fastmcp==4.0.10",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "langchain-core==1.6.6",
    "langfuse==4.16.0",
    "langgraph==1.2.12",
    "langgraph-checkpoint-postgres==3.1.2",
    "pgvector==0.5.0",
    "pillow==12.3.0",
    "psycopg[binary,pool]==3.3.6",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "sentence-transformers==6.1.0",
    "sqlalchemy[asyncio]==2.1.2",
    "tavily-python==0.8.4",
    "torch==2.14.1",
    "transformers==5.18.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/food_recommender"]

[tool.uv]
required-version = "==0.12.5"

# Keep Linux/Windows embeddings on CPU; macOS PyPI wheels are CPU builds.
# The explicit index cannot supply unrelated dependencies.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
